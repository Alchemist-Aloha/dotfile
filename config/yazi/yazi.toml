[plugin]
  prepend_preloaders = [
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
  ]
  prepend_previewers = [
    # Replace magick, image, video with mediainfo
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },
    # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
    { mime = "application/postscript", run = "mediainfo" },
    {mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run  = "ouch"}
  ]
  # There are more extensions which are supported by mediainfo.
  # Just add file's MIME type to `previewers`, `preloaders` above.
  # https://mediaarea.net/en/MediaInfo/Support/Formats

# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks

# Open files with the desktop application's MIME association.
# Override only the cases that should stay in a terminal or use a dedicated player.
[tasks]
  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
[mgr]
  linemode = "size_and_mtime"
  show_hidden = true

[preview]
  image_quality=60
  image_filter="nearest"

[opener]
# Files without a special rule use the desktop default application.
# `open --interactive` exposes every configured opener for undefined file types;
# normal `open` uses the first entry.
open = [
  { run = 'xdg-open %s1', desc = "Open with default application", orphan = true, for = "unix" },
  { run = 'gwenview %s1', desc = "Open in Gwenview", orphan = true, for = "unix" },
  { run = 'gimp %s1', desc = "Open in GIMP", orphan = true, for = "unix" },
  { run = 'satty --filename %s1', desc = "Annotate in Satty", orphan = true, for = "unix" },
  { run = 'inkscape %s1', desc = "Open in Inkscape", orphan = true, for = "unix" },
  { run = 'okular %s1', desc = "Open in Okular", orphan = true, for = "unix" },
  { run = 'google-chrome-stable %s1', desc = "Open in Google Chrome", orphan = true, for = "unix" },
  { run = 'fresh %s', desc = "Edit in Fresh", block = true, for = "unix" },
  { run = 'code --wait %s', desc = "Edit in VS Code", block = true, for = "unix" },
  { run = 'vim %s', desc = "Edit in Vim", block = true, for = "unix" },
  { run = 'nano %s', desc = "Edit in Nano", block = true, for = "unix" },
  { run = 'gnome-text-editor %s', desc = "Edit in GNOME Text Editor", block = true, for = "unix" },
  { run = 'dolphin %s1', desc = "Browse in Dolphin", orphan = true, for = "unix" },
  { run = 'mpv --really-quiet %s', desc = "Play in mpv", orphan = true, for = "unix" },
  { run = 'ark %s1', desc = "Open archive in Ark", orphan = true, for = "unix" },
  { run = 'libreoffice %s', desc = "Open in LibreOffice", orphan = true, for = "unix" },
]
image = [
  { run = 'gwenview %s1', desc = "Open in Gwenview", orphan = true, for = "unix" },
  { run = 'gimp %s1', desc = "Open in GIMP", orphan = true, for = "unix" },
  { run = 'satty --filename %s1', desc = "Annotate in Satty", orphan = true, for = "unix" },
  { run = 'xdg-open %s1', desc = "Open with image default", orphan = true, for = "unix" },
]
vector = [
  { run = 'inkscape %s1', desc = "Open in Inkscape", orphan = true, for = "unix" },
  { run = 'gimp %s1', desc = "Open in GIMP", orphan = true, for = "unix" },
  { run = 'gwenview %s1', desc = "Open in Gwenview", orphan = true, for = "unix" },
  { run = 'xdg-open %s1', desc = "Open with image default", orphan = true, for = "unix" },
]
pdf = [
  { run = 'okular %s1', desc = "Open in Okular", orphan = true, for = "unix" },
  { run = 'xdg-open %s1', desc = "Open with PDF default", orphan = true, for = "unix" },
]
browser = [
  { run = 'google-chrome-stable %s1', desc = "Open in Google Chrome", orphan = true, for = "unix" },
  { run = 'xdg-open %s1', desc = "Open with web default", orphan = true, for = "unix" },
]
# Text and source files show an editor chooser in Yazi.
edit = [
  { run = 'fresh %s', desc = "Edit in Fresh", block = true, for = "unix" },
  { run = 'kwrite %s', desc = "Edit in KWrite", orphan = true, for = "unix" },
  { run = 'code --wait %s', desc = "Edit in VS Code", block = true, for = "unix" },
  { run = 'vim %s', desc = "Edit in Vim", block = true, for = "unix" },
  { run = 'nano %s', desc = "Edit in Nano", block = true, for = "unix" },
  { run = 'gnome-text-editor %s', desc = "Edit in GNOME Text Editor", block = true, for = "unix" },
]
browse = [
  { run = 'dolphin %s1', desc = "Browse in Dolphin", orphan = true, for = "unix" },
]
play = [
  { run = 'mpv --really-quiet %s', desc = "Play in mpv", orphan = true, for = "unix" },
]
archive = [
  { run = 'ark %s1', desc = "Open archive in Ark", orphan = true, for = "unix" },
  { run = 'gwenview %s1', desc = "Open archive in Gwenview", orphan = true, for = "unix" },
]
office = [
  { run = 'libreoffice %s', desc = "Open in LibreOffice", orphan = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "inode/directory", use = "browse" },
  { mime = "application/pdf", use = "pdf" },
  { mime = "image/svg+xml", use = "vector" },
  { mime = "image/svg+xml-compressed", use = "vector" },
  { mime = "image/x-eps", use = "vector" },
  { mime = "application/postscript", use = "vector" },
  { mime = "application/illustrator", use = "vector" },
  { mime = "image/*", use = "image" },
  { mime = "text/html", use = "browser" },
  { mime = "application/xhtml+xml", use = "browser" },
  { mime = "audio/*", use = "play" },
  { mime = "video/*", use = "play" },
  { mime = "application/zip", use = "archive" },
  { mime = "application/x-7z-compressed", use = "archive" },
  { mime = "application/x-rar", use = "archive" },
  { mime = "application/x-tar", use = "archive" },
  { mime = "application/gzip", use = "archive" },
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document", use = "office" },
  { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = "office" },
  { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = "office" },
  { mime = "application/msword", use = "office" },
  { mime = "application/vnd.ms-excel", use = "office" },
  { mime = "application/vnd.ms-powerpoint", use = "office" },
  { mime = "text/*", use = "edit" },
  { url = "*.txt", use = "edit" },
  { url = "*.md", use = "edit" },
  { url = "*.markdown", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.ini", use = "edit" },
  { url = "*.conf", use = "edit" },
  { url = "*.py", use = "edit" },
  { url = "*.sh", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.rs", use = "edit" },
  { url = "*.go", use = "edit" },
  { url = "*.js", use = "edit" },
  { url = "*.ts", use = "edit" },
  { url = "*.css", use = "edit" },
]
append_rules = [
  { url = "*", use = "open" },
]
