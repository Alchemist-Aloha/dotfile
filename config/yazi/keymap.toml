[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"

# Location shortcuts: press g, then the listed key.
[[mgr.prepend_keymap]]
on = ["g", "g"]
run = "cd $HOME"
desc = "Go to $HOME"

# /mnt shortcuts: press g, then the listed key.
